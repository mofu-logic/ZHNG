services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: stock
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: stock
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stock -d stock"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  web:
    build: ./web
    environment:
      DATABASE_URL: postgresql://stock:${DB_PASSWORD}@db:5432/stock
    ports:
      - "8080:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:

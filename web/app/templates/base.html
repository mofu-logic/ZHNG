<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}株式ポートフォリオ{% endblock %}</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif; color: #1c2330; background: #f6f7f9; font-size: 16px; }
  header { background: #20304d; color: #fff; padding: 10px 18px; display: flex; gap: 18px; align-items: baseline; flex-wrap: wrap; }
  header .logo { font-weight: 700; font-size: 18px; }
  header nav a { color: #cdd8ea; text-decoration: none; margin-right: 14px; font-size: 15px; }
  header nav a:hover { color: #fff; text-decoration: underline; }
  main { max-width: none; margin: 0; padding: 12px 4px 32px; }
  h2 { font-size: 18px; margin: 20px 0 8px; }
  .sub { color: #5b6575; font-size: 13.5px; }
  .kpis { display: flex; gap: 10px; flex-wrap: wrap; margin: 12px 0 16px; }
  .kpi { flex: 1 1 30%; min-width: 280px; background: #fff; border: 1px solid #dde2ea; border-radius: 10px; padding: 10px 14px; }
  .kpi .k { font-size: 20px; font-weight: 700; color: #20304d; display: flex; align-items: center; gap: 8px; }
  .help { position: relative; margin-left: auto; flex: none; width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid #38557f; color: #38557f; background: #e8eff7; font-size: 14px; font-weight: 700; line-height: 1; display: inline-flex; align-items: center; justify-content: center; cursor: help; }
  .help::after { content: attr(data-tip); position: absolute; right: 0; top: calc(100% + 8px); width: 270px; white-space: normal; background: #20304d; color: #fff; font-size: 13px; font-weight: 400; line-height: 1.6; padding: 10px 12px; border-radius: 8px; box-shadow: 0 4px 16px rgba(0,0,0,.25); opacity: 0; pointer-events: none; transition: opacity .15s; z-index: 30; }
  .help:hover::after, .help:focus::after { opacity: 1; }
  .kpi .v { font-size: 23px; font-weight: 700; margin-top: 2px; }
  .kpi .t { font-size: 13.5px; color: #5b6575; margin-top: 2px; }
  .tblwrap { overflow-x: auto; background: #fff; border: 1px solid #dde2ea; border-radius: 10px; }
  table { border-collapse: collapse; width: 100%; font-size: 14.5px; background: #fff; }
  th { text-align: left; background: #38557f; color: #fff; font-size: 13px; padding: 7px 6px; border-bottom: 1px solid #2c4568; white-space: nowrap; }
  .date, .nowrap { white-space: nowrap; }
  th.sortable { cursor: pointer; user-select: none; }
  th.sortable:hover { background: #2c4568; }
  td { padding: 7px 6px; border-bottom: 1px solid #edf0f4; vertical-align: top; }
  tr:last-child td { border-bottom: none; }
  tbody tr { background: #ffffff; }
  tbody tr.alt { background: #e8eff7; }
  tbody tr:hover { background: #d7e6f3; }
  .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .pos { color: #177245; } .neg { color: #c62f3b; }
  .code { color: #71809a; font-size: 12.5px; }
  .code a { color: #38557f; font-weight: 700; text-decoration: none; }
  .code a:hover { text-decoration: underline; }
  .name { font-weight: 600; }
  .memo { min-width: 170px; max-width: 280px; white-space: normal; }
  .filters { display: flex; gap: 10px; flex-wrap: wrap; margin: 10px 0; align-items: center; }
  .filters input, .filters select { font-size: 14.5px; font-weight: 400; padding: 6px 8px; border: 1px solid #c9d1de; border-radius: 8px; background: #fff; }
  .filters label { font-size: 14px; font-weight: 700; color: #20304d; background: #fff; border: 1px solid #aebdd2; border-left: 4px solid #38557f; border-radius: 8px; padding: 5px 8px 5px 10px; display: flex; align-items: center; gap: 7px; }
  .fcount { font-size: 17px; font-weight: 700; color: #fff; background: #38557f; border: 1px solid #38557f; border-radius: 999px; padding: 5px 14px; margin-right: 10px; white-space: nowrap; }
  button, .btn { font-size: 14.5px; padding: 6px 14px; border-radius: 8px; border: 1px solid #20304d; background: #20304d; color: #fff; cursor: pointer; }
  button.sub { background: #fff; color: #20304d; }
  input[type="text"], input[type="number"], input[type="date"] { font-size: 14px; padding: 5px 7px; border: 1px solid #c9d1de; border-radius: 6px; }
  .tag { display: inline-block; font-size: 12.5px; padding: 1px 7px; border-radius: 999px; border: 1px solid #c9d1de; color: #43506a; background: #eef1f6; }
  .foot { color: #5b6575; font-size: 13px; margin-top: 10px; }
  .tabs { display: flex; gap: 6px; margin: 12px 0 10px; }
  .tab { font-size: 14.5px; padding: 6px 16px; border-radius: 999px; border: 1px solid #c9d1de; background: #fff; color: #1c2330; cursor: pointer; }
  .tab.active { background: #20304d; color: #fff; border-color: #20304d; }
  .addform { display: flex; flex-wrap: wrap; gap: 8px; align-items: end; margin: 4px 0 12px; }
  .addform label { font-size: 13px; color: #5b6575; display: flex; flex-direction: column; gap: 2px; }
  .addform input, .addform select { font-size: 14px; padding: 5px 7px; border: 1px solid #c9d1de; border-radius: 6px; background: #fff; }
  .delbtn { font-size: 13px; padding: 3px 9px; border-radius: 6px; border: 1px solid #c9d1de; background: #fff; color: #c62f3b; cursor: pointer; }
</style>
</head>
<body>
<header>
  <div class="logo">株式ポートフォリオ</div>
  <nav>
    <a href="/summary">サマリー</a>
    <a href="/">保有株一覧</a>
    <a href="/history">売買履歴</a>
    <a href="/master">配当・優待マスタ</a>
    <a href="/settings">KPI設定</a>
    <a href="/data">データ更新</a>
  </nav>
</header>
<main>
{% block content %}{% endblock %}
</main>
<script>
  // Visible-row striping for static tables (dashboard does its own after filter/sort)
  document.querySelectorAll('tbody').forEach(tb => {
    if (tb.closest('#holdings')) return;
    let i = 0;
    tb.querySelectorAll('tr').forEach(r => {
      if (r.style.display === 'none') return;
      r.classList.toggle('alt', i % 2 === 1);
      i++;
    });
  });
</script>
</body>
</html>

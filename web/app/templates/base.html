<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}株式ポートフォリオ{% endblock %}</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif; color: #1c2330; background: #f6f7f9; font-size: 16px; }
  :root { --header-h: 50px; }
  header { background: #20304d; color: #fff; padding: 8px 14px; display: flex; gap: 12px; align-items: center; height: var(--header-h); position: sticky; top: 0; z-index: 50; }
  header .logo { font-weight: 700; font-size: 18px; }
  #sidebar-toggle { background: transparent; border: none; color: #fff; padding: 6px; display: inline-flex; border-radius: 8px; }
  #sidebar-toggle:hover { background: rgba(255,255,255,.14); }
  #sidebar-toggle svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; }
  .layout { display: flex; align-items: stretch; }
  #sidebar { width: 216px; flex: none; background: #fff; border-right: 1px solid #dde2ea; padding: 10px 8px; display: flex; flex-direction: column; gap: 2px; position: sticky; top: var(--header-h); height: calc(100vh - var(--header-h)); height: calc(100dvh - var(--header-h)); overflow-y: auto; overflow-x: hidden; transition: width .18s ease; }
  .side-item { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; color: #1c2330; text-decoration: none; font-size: 15px; white-space: nowrap; }
  .side-item:hover { background: #eef1f6; }
  .side-item.active { background: #e8eff7; color: #20304d; font-weight: 700; }
  .side-item svg { flex: none; width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .side-bottom { margin-top: auto; border-top: 1px solid #edf0f4; padding-top: 8px; display: flex; flex-direction: column; gap: 2px; }
  html.sb-collapsed #sidebar { width: 58px; padding: 10px 6px; }
  html.sb-collapsed .side-item { justify-content: center; padding: 9px 0; }
  html.sb-collapsed .side-item .side-label { display: none; }
  main { flex: 1; min-width: 0; margin: 0; padding: 12px 14px 32px; }
  h2 { font-size: 18px; margin: 20px 0 8px; }
  .sub { color: #5b6575; font-size: 13.5px; }
  .kpis { display: flex; gap: 10px; flex-wrap: wrap; margin: 12px 0 16px; }
  .kpi { flex: 1 1 30%; min-width: 280px; background: #fff; border: 1px solid #dde2ea; border-radius: 10px; padding: 10px 14px; }
  .kpi .k { font-size: 20px; font-weight: 700; color: #20304d; display: flex; align-items: center; gap: 8px; }
  .help { position: relative; margin-left: auto; flex: none; width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid #38557f; color: #38557f; background: #e8eff7; font-size: 14px; font-weight: 700; line-height: 1; display: inline-flex; align-items: center; justify-content: center; cursor: help; }
  .help::after { content: attr(data-tip); position: absolute; right: 0; top: calc(100% + 8px); width: 270px; white-space: pre-line; background: #20304d; color: #fff; font-size: 13px; font-weight: 400; line-height: 1.6; padding: 10px 12px; border-radius: 8px; box-shadow: 0 4px 16px rgba(0,0,0,.25); opacity: 0; pointer-events: none; transition: opacity .15s; z-index: 30; }
  .help.tip-right::after { right: auto; left: 0; }
  .help:hover::after, .help:focus::after { opacity: 1; }
  .kpi .v { font-size: 23px; font-weight: 700; margin-top: 2px; }
  .kpi .t { font-size: 13.5px; color: #5b6575; margin-top: 2px; }
  .tblwrap { overflow-x: auto; background: #fff; border: 1px solid #dde2ea; border-radius: 10px; }
  table { border-collapse: collapse; width: 100%; font-size: 14.5px; background: #fff; }
  th { text-align: left; background: #38557f; color: #fff; font-size: 13px; padding: 7px 6px; border-bottom: 1px solid #2c4568; white-space: nowrap; }
  .date, .nowrap { white-space: nowrap; }
  th.sortable { cursor: pointer; user-select: none; }
  th.sortable:hover { background: #2c4568; }
  td { padding: 7px 6px; border-bottom: 1px solid #edf0f4; vertical-align: top; }
  tr:last-child td { border-bottom: none; }
  tbody tr { background: #ffffff; }
  tbody tr.alt { background: #e8eff7; }
  tbody tr:hover { background: #d7e6f3; }
  .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .pos { color: #177245; } .neg { color: #c62f3b; }
  .code { color: #71809a; font-size: 12.5px; }
  .code a { color: #38557f; font-weight: 700; text-decoration: none; }
  .code a:hover { text-decoration: underline; }
  .name { font-weight: 600; }
  .memo { min-width: 170px; max-width: 280px; white-space: normal; }
  .filters { display: flex; gap: 10px; flex-wrap: wrap; margin: 10px 0; align-items: center; }
  .filters input, .filters select { font-size: 14.5px; font-weight: 400; padding: 6px 8px; border: 1px solid #c9d1de; border-radius: 8px; background: #fff; }
  .filters label { font-size: 14px; font-weight: 700; color: #20304d; background: #fff; border: 1px solid #aebdd2; border-left: 4px solid #38557f; border-radius: 8px; padding: 5px 8px 5px 10px; display: flex; align-items: center; gap: 7px; }
  .fcount { font-size: 17px; font-weight: 700; color: #fff; background: #38557f; border: 1px solid #38557f; border-radius: 999px; padding: 5px 14px; margin-right: 10px; white-space: nowrap; }
  button, .btn { font-size: 14.5px; padding: 6px 14px; border-radius: 8px; border: 1px solid #20304d; background: #20304d; color: #fff; cursor: pointer; }
  button.sub { background: #fff; color: #20304d; }
  input[type="text"], input[type="number"], input[type="date"] { font-size: 14px; padding: 5px 7px; border: 1px solid #c9d1de; border-radius: 6px; }
  .tag { display: inline-block; font-size: 12.5px; padding: 1px 7px; border-radius: 999px; border: 1px solid #c9d1de; color: #43506a; background: #eef1f6; }
  .foot { color: #5b6575; font-size: 13px; margin-top: 10px; }
  .tabs { display: flex; gap: 6px; margin: 12px 0 10px; }
  .tab { font-size: 14.5px; padding: 6px 16px; border-radius: 999px; border: 1px solid #c9d1de; background: #fff; color: #1c2330; cursor: pointer; }
  .tab.active { background: #20304d; color: #fff; border-color: #20304d; }
  .addform { display: flex; flex-wrap: wrap; gap: 8px; align-items: end; margin: 4px 0 12px; }
  .addform label { font-size: 13px; color: #5b6575; display: flex; flex-direction: column; gap: 2px; }
  .addform input, .addform select { font-size: 14px; padding: 5px 7px; border: 1px solid #c9d1de; border-radius: 6px; background: #fff; }
  .delbtn { font-size: 13px; padding: 3px 9px; border-radius: 6px; border: 1px solid #c9d1de; background: #fff; color: #c62f3b; cursor: pointer; }
  .dlg-overlay { position: fixed; inset: 0; background: rgba(20, 28, 45, .45); display: flex; align-items: center; justify-content: center; z-index: 100; opacity: 0; transition: opacity .15s; }
  .dlg-overlay.show { opacity: 1; }
  .dlg { background: #fff; border-radius: 14px; box-shadow: 0 12px 40px rgba(0,0,0,.3); max-width: 420px; width: calc(100% - 40px); padding: 20px 22px; transform: translateY(6px) scale(.98); transition: transform .15s; }
  .dlg-overlay.show .dlg { transform: none; }
  .dlg-title { font-size: 17px; font-weight: 700; color: #20304d; margin-bottom: 8px; }
  .dlg-msg { font-size: 14.5px; line-height: 1.65; color: #1c2330; white-space: pre-wrap; }
  .dlg-btns { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }
  .dlg-btns .dlg-cancel { background: #fff; color: #20304d; border: 1px solid #c9d1de; }
  .dlg-btns .dlg-danger { background: #c62f3b; border-color: #c62f3b; }
  .memo-tip { border-bottom: 1px dotted #7a879c; cursor: help; }
  .memo-tip-box { position: fixed; width: 300px; white-space: pre-wrap; background: #20304d; color: #fff; font-size: 13px; font-weight: 400; line-height: 1.6; padding: 10px 12px; border-radius: 8px; box-shadow: 0 4px 16px rgba(0,0,0,.25); z-index: 200; pointer-events: none; text-align: left; }
  .preview-name { font-weight: 700; color: #20304d; }
  .preview-err { color: #c62f3b; }
</style>
</head>
<body>
<script>
  // Restore the sidebar state before first paint (no flash). Narrow
  // screens start collapsed unless the user chose otherwise.
  try {
    const saved = localStorage.getItem('sb-collapsed');
    if (saved === '1' || (saved === null && window.innerWidth < 760)) {
      document.documentElement.classList.add('sb-collapsed');
    }
  } catch (e) {}
</script>
<header>
  <button id="sidebar-toggle" type="button" aria-label="サイドメニューの表示切り替え" title="サイドメニューの表示切り替え"><svg viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>
  <div class="logo">株式ポートフォリオ</div>
</header>
<div class="layout">
<nav id="sidebar">
  <a class="side-item" href="/summary" title="サマリー"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="8" height="8" rx="1"/><rect x="13" y="3" width="8" height="5" rx="1"/><rect x="13" y="10" width="8" height="11" rx="1"/><rect x="3" y="13" width="8" height="8" rx="1"/></svg><span class="side-label">サマリー</span></a>
  <a class="side-item" href="/" title="保有株一覧"><svg viewBox="0 0 24 24"><path d="M9 6h12M9 12h12M9 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg><span class="side-label">保有株一覧</span></a>
  <a class="side-item" href="/history" title="売買履歴"><svg viewBox="0 0 24 24"><path d="M3 8h14M13 4l4 4-4 4M21 16H7M11 12l-4 4 4 4"/></svg><span class="side-label">売買履歴</span></a>
  <a class="side-item" href="/master" title="配当・優待マスタ"><svg viewBox="0 0 24 24"><rect x="3" y="8" width="18" height="4"/><path d="M5 12v9h14v-9M12 8v13M12 8s-4.5 0-4.5-2.6C7.5 3 12 3.4 12 8zM12 8s4.5 0 4.5-2.6C16.5 3 12 3.4 12 8z"/></svg><span class="side-label">配当・優待マスタ</span></a>
  <a class="side-item" href="/candidates" title="購入候補"><svg viewBox="0 0 24 24"><path d="M6 3h12v18l-6-4.5L6 21z"/></svg><span class="side-label">購入候補</span></a>
  <div class="side-bottom">
    <a class="side-item" href="/settings" title="設定"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg><span class="side-label">設定</span></a>
    <a class="side-item" href="/data" title="データ更新"><svg viewBox="0 0 24 24"><path d="M23 4v6h-6M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg><span class="side-label">データ更新</span></a>
    <a class="side-item" href="/logs" title="ログ"><svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M16 13H8M16 17H8M10 9H8"/></svg><span class="side-label">ログ</span></a>
  </div>
</nav>
<main>
{% block content %}{% endblock %}
</main>
</div>
<script>
  // Sidebar: hamburger toggles icon+label / icon-only (persisted),
  // and the current page is highlighted.
  const sbToggle = document.getElementById('sidebar-toggle');
  if (sbToggle) {
    sbToggle.addEventListener('click', () => {
      const collapsed = document.documentElement.classList.toggle('sb-collapsed');
      try { localStorage.setItem('sb-collapsed', collapsed ? '1' : '0'); } catch (e) {}
    });
  }
  document.querySelectorAll('#sidebar .side-item').forEach(a => {
    if (a.getAttribute('href') === location.pathname) a.classList.add('active');
  });

  // Shared helpers for the JSON API (/api/v1): the UI and external
  // integrations use the same interface.
  async function apiJson(method, url, obj) {
    const r = await fetch(url, {
      method,
      headers: {'Content-Type': 'application/json'},
      body: obj === undefined ? undefined : JSON.stringify(obj),
    });
    if (!r.ok) { alert('保存に失敗しました（' + r.status + '）'); throw new Error('api ' + r.status); }
    return r.status === 204 ? null : r.json();
  }
  // Modern modal dialog (replaces alert/confirm). Resolves true when
  // the OK button is chosen, false on cancel / overlay click / Esc.
  function showDialog({title, message, okText = 'OK', cancelText = null, danger = false}) {
    return new Promise(resolve => {
      const overlay = document.createElement('div');
      overlay.className = 'dlg-overlay';
      const dlg = document.createElement('div');
      dlg.className = 'dlg';
      dlg.setAttribute('role', 'dialog');
      dlg.setAttribute('aria-modal', 'true');
      const t = document.createElement('div');
      t.className = 'dlg-title';
      t.textContent = title;
      const m = document.createElement('div');
      m.className = 'dlg-msg';
      m.textContent = message || '';
      const btns = document.createElement('div');
      btns.className = 'dlg-btns';
      const close = (val) => {
        overlay.classList.remove('show');
        document.removeEventListener('keydown', onKey);
        setTimeout(() => overlay.remove(), 150);
        resolve(val);
      };
      const onKey = (e) => { if (e.key === 'Escape') close(false); };
      if (cancelText) {
        const cb = document.createElement('button');
        cb.type = 'button';
        cb.className = 'dlg-cancel';
        cb.textContent = cancelText;
        cb.addEventListener('click', () => close(false));
        btns.appendChild(cb);
      }
      const ok = document.createElement('button');
      ok.type = 'button';
      if (danger) ok.className = 'dlg-danger';
      ok.textContent = okText;
      ok.addEventListener('click', () => close(true));
      btns.appendChild(ok);
      overlay.addEventListener('click', (e) => { if (e.target === overlay) close(false); });
      document.addEventListener('keydown', onKey);
      dlg.append(t, m, btns);
      overlay.appendChild(dlg);
      document.body.appendChild(overlay);
      requestAnimationFrame(() => overlay.classList.add('show'));
      ok.focus();
    });
  }

  // Hover tooltip for truncated texts (.memo-tip). Rendered as a
  // fixed-position box on <body>: an in-table tooltip would overflow
  // the scrollable table wrapper and give it a vertical scrollbar.
  let tipBox = null;
  function hideTip() { if (tipBox) { tipBox.remove(); tipBox = null; } }
  document.querySelectorAll('.memo-tip').forEach(el => {
    el.addEventListener('mouseenter', () => {
      hideTip();
      tipBox = document.createElement('div');
      tipBox.className = 'memo-tip-box';
      tipBox.textContent = el.dataset.tip || '';
      document.body.appendChild(tipBox);
      const r = el.getBoundingClientRect();
      let top = r.bottom + 6;
      if (top + tipBox.offsetHeight > window.innerHeight - 8) {
        top = Math.max(8, r.top - tipBox.offsetHeight - 6);
      }
      let left = r.left;
      if (left + tipBox.offsetWidth > window.innerWidth - 8) {
        left = window.innerWidth - tipBox.offsetWidth - 8;
      }
      tipBox.style.top = top + 'px';
      tipBox.style.left = left + 'px';
    });
    el.addEventListener('mouseleave', hideTip);
  });
  window.addEventListener('scroll', hideTip, true);

  function strOrNull(v) { v = (v || '').trim(); return v === '' ? null : v; }
  function numOrNull(v) { return v === '' || v == null ? null : Number(v); }
  function intOrNull(v) { return v === '' || v == null ? null : parseInt(v, 10); }

  // Visible-row striping for static tables (dashboard does its own after filter/sort)
  document.querySelectorAll('tbody').forEach(tb => {
    if (tb.closest('#holdings')) return;
    let i = 0;
    tb.querySelectorAll('tr').forEach(r => {
      if (r.style.display === 'none') return;
      r.classList.toggle('alt', i % 2 === 1);
      i++;
    });
  });
</script>
</body>
</html>

name: CI

# This repository allows local actions only, so the workflow uses no
# external `uses:` actions at all. Checkout is done with plain git.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init -q src
          cd src
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git fetch -q --depth=1 origin "${{ github.ref }}"
          git checkout -q FETCH_HEAD
      - name: Syntax check (compileall)
        run: python3 -m compileall -q src/web/app
      - name: Lint (ruff, scope pinned in ruff.toml)
        run: |
          pip install --quiet "ruff==0.17.6"
          cd src && ruff check web/app

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init -q src
          cd src
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git fetch -q --depth=1 origin "${{ github.ref }}"
          git checkout -q FETCH_HEAD
      - name: Build web image
        run: docker build -t zhng-web:ci src/web

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init -q src
          cd src
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git fetch -q origin "${{ github.ref }}"
          git checkout -q FETCH_HEAD
      - name: Scan for secrets (gitleaks, pinned image)
        run: docker run --rm -v "$PWD/src:/repo" ghcr.io/gitleaks/gitleaks:v8.24.3 git /repo --redact
